<!DOCTYPE html>
<html>
<head>
  <title>ENDOOM Viewer</title>
  <!--<link rel="icon" type="image/x-icon" href="images/ptero.gif">-->

  <meta property="og:title" content="ENDOOM Viewer" />
  <meta property="og:description" content="A website to view the ENDOOM of Doom WADs." />
  <!--<meta property="og:image" content="https://ptero.pedro-beirao.eu/images/ptero.gif" />-->
  <meta property="og:url" content="https://endoom.pedro-beirao.eu" />
  <meta property="og:type" content="website" />

  <link rel="stylesheet" href="index.css">
</head>
<body>

  <h1>ENDOOM Viewer</h1>

  <div class="button-list">
    <label for="choose-wad" class="choose-button">Choose WAD</label>
    <input id="choose-wad" type="file" accept=".wad" hidden>

    <button onclick="save_image()">Save PNG</button>
  </div>

  <div id="endoom-display">
    nothing loaded
  </div>

  <div class="button-list">
    Or you can load some ENDOOM's from these selected WADs (all made by Arsinikk):
  </div>

  <div class="button-list" style="gap: 1em;">
    <button onclick="builtin_file('100lnm.ans')">100 Line Massacre</button>
    <button onclick="builtin_file('200lnmas.ans')">200 Line Christmas</button>
    <button onclick="builtin_file('hrs.ans')">Hell Revelations</button>
    <button onclick="builtin_file('slotter.ans')">Slotter</button>
    <button onclick="builtin_file('rust1.ans')">RUST 1</button>
    <button onclick="builtin_file('rust2.ans')">RUST 2</button>
  </div>

  <script src="index.js"></script>
</body>
